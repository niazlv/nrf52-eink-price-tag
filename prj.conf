# The upstream sample bridged UART to BLE; this firmware has no UART path at
# all — commands arrive over NUS and diagnostics go back the same way. No
# serial driver, no console.
CONFIG_SERIAL=n
CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n

# Bit-banged 9-bit SPI to the panel needs plain GPIOs, not a SPI peripheral.
CONFIG_GPIO=y

CONFIG_HEAP_MEM_POOL_SIZE=1024

CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="nrf52-E-ink-clock"
CONFIG_BT_DEVICE_NAME_DYNAMIC=y
CONFIG_BT_DEVICE_NAME_MAX=25
CONFIG_BT_DEVICE_APPEARANCE=833
CONFIG_BT_MAX_CONN=1
CONFIG_BT_MAX_PAIRED=1

# Enable the NUS service
CONFIG_BT_NUS=y

# ATT MTU 498: lets one vstream DRLE frame (~1.5KB) travel in 3 ATT writes
# instead of 7 — macOS paces write-without-response per ATT operation, so
# fewer/bigger writes = higher downlink throughput. L2CAP reassembles from
# 251-byte link-layer fragments (DLE); RX buffers must fit MTU+4.
CONFIG_BT_L2CAP_TX_MTU=498
CONFIG_BT_BUF_ACL_TX_SIZE=251
CONFIG_BT_BUF_ACL_RX_SIZE=502
CONFIG_BT_CTLR_DATA_LENGTH_MAX=251

# 2M PHY: doubles raw throughput for VSTREAM (peripheral requests it on connect)
CONFIG_BT_CTLR_PHY_2M=y
CONFIG_BT_USER_PHY_UPDATE=y

# --- Phase 1: connectionless flood-mesh between tags ---
# Observer = scan for mesh beacons. TX uses the existing LEGACY adv instance,
# time-shared: briefly switch it to a non-connectable mesh beacon, then restore
# the connectable NUS adv. (Ext adv would cost ~44 KB flash — over budget.)
CONFIG_BT_OBSERVER=y

# Extra ACL RX buffers: vstream pipelining queues several frames in flight
# while the RX thread blocks in ssd1675a_wait_busy() (~64 ms per frame).
# Reduced from 5 to 3 to fit with MCUboot.
CONFIG_BT_BUF_ACL_RX_COUNT_EXTRA=3

# BLE pairing / LE Secure Connections DISABLED. SMP+ECC (P-256 ECDH) pulls
# mbedtls/PSA/oberon into the app image (~31 KB flash, ~6.4 KB RAM) — exactly the
# room the connectionless mesh scanner (CONFIG_BT_OBSERVER) needs. The security
# model is app-level secauth (challenge-response, bt_encrypt_be) + the MCUboot
# signing key + per-message CMAC on mesh PDUs — link-layer pairing added nothing
# those don't already cover for this fleet (shelf prices are public data).
CONFIG_BT_SMP=n
CONFIG_BT_NUS_SECURITY_ENABLED=n
CONFIG_BT_BONDABLE=n

# Settings/NVS still needed (secauth key, custom name, persisted stats).
CONFIG_BT_SETTINGS=y
# Persistent stats (src/app/persist.c): settings_save_one() for the low-battery
# flash backstop. Pulled in by BT_SETTINGS already; kept explicit for clarity.
CONFIG_SETTINGS=y
CONFIG_FLASH=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_FLASH_MAP=y

# Enable DK LED and Buttons library
CONFIG_DK_LIBRARY=y

CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=1280
# Logging disabled entirely. Every backend was already off (no console, no RTT,
# no UART backend), so LOG strings + per-module const source descriptors had no
# output path at all — pure waste. Dropping CONFIG_LOG saves ~20.5 KB flash
# (~13.8 KB of it in .data source descriptors registered by the BLE host).
# Debug output is via ble_printf() over NUS, not the logging subsystem.
CONFIG_LOG=n
CONFIG_USE_SEGGER_RTT=n

CONFIG_ASSERT=n
CONFIG_FPU=y
CONFIG_ADC=y
CONFIG_REBOOT=y
CONFIG_POWEROFF=y

# --- OTA DFU via BLE (mcumgr / SMP) ---
CONFIG_NCS_SAMPLE_MCUMGR_BT_OTA_DFU=y
CONFIG_MCUMGR_TRANSPORT_BT_REASSEMBLY=y
# Text commands no longer execute on the BLE host RX thread (they have their
# own thread in commands.c), so it only needs room for the host itself.
CONFIG_BT_RX_STACK_SIZE=1536
CONFIG_MCUMGR_GRP_IMG_UPLOAD_CHECK_HOOK=n
# DFU status events (started / chunk / stopped / pending) drive the command
# dispatcher's "busy with an update" window — see commands.c dfu_mgmt_cb.
CONFIG_MCUMGR_MGMT_NOTIFICATION_HOOKS=y
CONFIG_MCUMGR_GRP_IMG_STATUS_HOOKS=y
# Do NOT shrink below ~512: the "image list" RESPONSE with two slots is
# ~260 B incl. SMP header. With 256 the device answers rc=8 (EMSGSIZE),
# the host sees "no image in slot 1" and the update is never applied.
CONFIG_MCUMGR_TRANSPORT_NETBUF_SIZE=1024
CONFIG_SIZE_OPTIMIZATIONS=y

# Trim MCUmgr: keep only img_mgmt, disable OS and basic groups
CONFIG_MCUMGR_GRP_OS=n
CONFIG_MCUMGR_GRP_ZBASIC=n
CONFIG_MCUMGR_GRP_ZBASIC_STORAGE_ERASE=n

# Use integer-only printf to save ~1.5KB flash
CONFIG_CBPRINTF_NANO=y

# Link-Time Optimization: cross-module inlining + dead-code elimination.
# Biggest single flash lever here; needed to keep OTA images under the
# swap-using-move 56-sector ceiling with room to spare.
# LTO requires per-IRQ-local ISR table declaration (else Kconfig drops LTO).
CONFIG_ISR_TABLES_LOCAL_DECLARATION=y
CONFIG_LTO=y
