# Host-side checks only: no Zephyr toolchain, so this stays under a minute.
# The firmware itself is built and size-checked by `make build` on a machine
# with nRF Connect SDK v3.0.1 (see README "Building").
name: ci

on:
  push:
  pull_request:

jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: C host tests (lib/ + src/app, ASan/UBSan)
        run: make test

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Web protocol parsers
        run: node --test tests/web/protocol.test.js

      - name: Web shell is self-consistent
        # Every file index.html loads must be precached by the service
        # worker, or the installed app breaks offline after the next deploy.
        run: |
          cd lut_tester_host/web
          for f in $(grep -oE '(src|href)="[^"]+\.(js|css)"' index.html | sed -E 's/.*="([^"]+)"/\1/'); do
            grep -q "'./$f'" sw.js || { echo "sw.js ASSETS is missing $f"; exit 1; }
          done
          echo "ok"
